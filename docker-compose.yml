# Production on one EC2 instance: the app behind Caddy (automatic HTTPS).
#   DOMAIN=13-234-56-78.sslip.io docker compose up -d --build
# See deploy/EC2.md.
services:
  vaani:
    build: .
    env_file: .env
    environment:
      ENVIRONMENT: production
      HOST: 127.0.0.1          # only Caddy can reach the app
      PORT: "7860"
      TRUST_PROXY: "true"
    # WebRTC audio uses UDP ports picked at call time, so the app shares the
    # host's network instead of mapping a port range through Docker.
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:size=256m
    volumes:
      - vaani-var:/app/var     # audit log
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1500m
    pids_limit: 256
    restart: unless-stopped

  caddy:
    image: caddy:2
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. 13-234-56-78.sslip.io}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    restart: unless-stopped

volumes:
  vaani-var:
  caddy-data:
  caddy-config:
